 main.querySelectorAll("[data-filter]").forEach(el=>el.addEventListener("click",()=>{state.source=el.dataset.filter;render()}));
 main.querySelectorAll("[data-group]").forEach(el=>el.addEventListener("click",()=>{state.openGroup=state.openGroup===el.dataset.group?null:el.dataset.group;render()}));
 const search=$("#clientSearch");if(search)search.addEventListener("input",e=>{const at=e.target.selectionStart;state.query=e.target.value;render();const f=$("#clientSearch");f.focus();f.setSelectionRange(at,at)});
 const tool=$("#toolSearch");if(tool)tool.addEventListener("input",e=>{const at=e.target.selectionStart;state.toolQuery=e.target.value;render();const f=$("#toolSearch");f.focus();f.setSelectionRange(at,at)});
 document.querySelectorAll("[data-tab]").forEach(el=>el.addEventListener("click",()=>{state.tab=Number(el.dataset.tab);state.details=[];render()}));
 main.scrollTop=0;
}
function back(){if(state.details.length)state.details.pop();else state.tab=0;render()}
function showModal(which){$("#dialog").innerHTML='<div class="modalWrap"><div class="modal" role="dialog" aria-modal="true"><h3>⚠ 操作确认示意</h3><p>“'+esc(which)+'”在真实 APP 中可能中断网络或修改配置。正式版应显示差异、风险、回滚时限，并等待服务端结果。</p><p>当前是离线设计原型，点击继续不会执行任何操作。</p><div class="actions"><button class="secondary" id="modalCancel">取消</button><button class="danger" id="modalOk">仅演示继续</button></div></div></div>';$("#modalCancel").onclick=()=>$("#dialog").innerHTML="";$("#modalOk").onclick=()=>{$("#dialog").innerHTML="";alert("设计原型：未进行任何路由器操作。")}}
$("#back").addEventListener("click",back);$("#routerSwitch").addEventListener("click",()=>{state.details.push("路由器管理");render()});$("#theme").addEventListener("click",()=>{state.dark=!state.dark;document.body.classList.toggle("dark",state.dark)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.querySelector(".modalWrap"))back()});
render();
</script></body></html>
