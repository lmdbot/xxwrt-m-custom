name: XX-WRT Material Android APK

on:
  workflow_dispatch:
  push:
    branches: [feature/material-ui, main]
    paths:
      - "ui/material-prototype/**"
      - "docs/releases/**"
      - ".github/workflows/ui-android-preview.yml"

concurrency:
  group: material-ui-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup-v2-0-2-assets:
    # The old filename was accidentally uploaded alongside the canonical
    # v2.0.2 APK. This small job also works if the Android build later fails.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove redundant v2.0.2 legacy-named APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.0.2"
          OBSOLETE="XX-WRT-M-Material-QWRT-v2.0.2.apk"
          if gh release view "$TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY" | grep -Fxq "$OBSOLETE"; then
            gh release delete-asset "$TAG" "$OBSOLETE" --yes --repo "$GITHUB_REPOSITORY"
            echo "Deleted redundant APK from $TAG"
          else
            echo "No duplicate legacy APK found on $TAG"
          fi

  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ui/material-prototype
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            shopt -s nullglob
            managers=( "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager )
            (( ${#managers[@]} > 0 )) || exit 1
            SDKMANAGER="${managers[${#managers[@]}-1]}"
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund

      - name: Verify stable release version comparison
        run: npm run test:versions

      - name: Verify terminal lease formatting and drawer swipe gestures
        run: npm run test:logic

      - name: Verify five-version mirror APK retention
        run: python3 -m unittest discover -s ../../.github/scripts -p 'test_prune_mirror_apks.py' -v

      - name: Verify native in-app APK updater integration
        run: python3 -m unittest discover -s scripts -p 'test_patch_android_updater.py' -v

      - name: Verify Android configuration Save As integration
        run: python3 -m unittest discover -s scripts -p 'test_patch_android_config_export.py' -v

      - name: Set Android version and APK filename
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p 'require("./package.json").version')"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid stable app version"; exit 1; }
          IFS='.' read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          (( 10#$MINOR < 1000 && 10#$PATCH < 1000 )) || exit 1
          APP_VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          (( APP_VERSION_CODE > 20001 && APP_VERSION_CODE <= 2100000000 )) || exit 1
          APP_APK_NAME="XX-WRT-Material-v${APP_VERSION}.apk"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_APK_NAME=$APP_APK_NAME" >> "$GITHUB_ENV"
          echo "Building $APP_APK_NAME (versionCode $APP_VERSION_CODE)"

      - name: Build Material UI
        run: npm run build

      - name: Install Chromium for interaction tests
        run: npx playwright install --with-deps chromium

      - name: Verify Material rendering, touch controls, and scroll
        run: npm run test:ui

      - name: Upload mobile UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-ui-smoke-screenshots
          path: ui/material-prototype/test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: material-ui-playwright-failure
          path: ui/material-prototype/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate native Capacitor app
        run: |
          npx cap add android
          npx cap sync android
          # HTTP is used only when the user selects an HTTP router endpoint.
          # Android 9+ blocks plain HTTP by default without an explicit policy.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          src = path.read_text()
          if '<application' not in src:
              raise SystemExit('Android application element missing')
          src = src.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(src)
          PY
          # Generate Android versionCode from the numeric x.y.z version.
          sed -i -E "s/versionCode [0-9]+/versionCode ${APP_VERSION_CODE}/; s/versionName \"[^\"]+\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          # Capacitor must generate the requested system launcher label.
          grep -F 'XX-WRT管理器' android/app/src/main/res/values/strings.xml

      - name: Apply Android 15/16 native safe-area insets
        run: python3 scripts/patch_android_insets.py

      - name: Enable private in-app APK downloader and system installer
        run: python3 scripts/patch_android_updater.py

      - name: Enable Android configuration Save As picker
        run: python3 scripts/patch_android_config_export.py

      # Capacitor generates its default app icons when Android is initialized.
      # Always replace those after npx cap add/sync so APKs keep the chosen
      # QWRT router + shield artwork, even in fresh GitHub Actions runners.
      - name: Apply selected QWRT launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/generate_app_icons.py
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Inject per-router opt-in TLS certificate exception bridge
        run: python3 scripts/patch_router_tls.py

      - name: Compile unsigned release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign Material APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XXWRT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XXWRT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing signing key"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing signing password"; exit 1; }
          mkdir -p ../../build/material-preview/private ../../dist/material-preview
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ../../build/material-preview/private/signing.p12
          chmod 600 ../../build/material-preview/private/signing.p12
          INPUT="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*unsigned*.apk' -print -quit)"
          test -n "$INPUT" || { echo "::error::Unsigned APK missing"; exit 1; }
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -p -f 4 "$INPUT" ../../build/material-preview/aligned.apk
          "$TOOLS/zipalign" -c 4 ../../build/material-preview/aligned.apk
          "$TOOLS/apksigner" sign \
            --ks ../../build/material-preview/private/signing.p12 \
            --ks-type PKCS12 --ks-key-alias xxwrt \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out ../../dist/material-preview/${APP_APK_NAME} \
            ../../build/material-preview/aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs ../../dist/material-preview/${APP_APK_NAME}
          # Validate against the actual Gradle versionCode so future version bumps cannot leave a stale check.
          EXPECTED_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' android/app/build.gradle | head -n1)"
          test -n "$EXPECTED_VERSION_CODE" || { echo "::error::Cannot read Gradle versionCode"; exit 1; }
          "$TOOLS/aapt" dump badging "../../dist/material-preview/${APP_APK_NAME}" | grep '^package:' | grep "versionName='${APP_VERSION}'" | grep "versionCode='$EXPECTED_VERSION_CODE'" | grep "name='com.lmdbot.xxwrt.materialpreview'"
          # Safety check: never publish a legacy UniApp package as a Material APK.
          "$TOOLS/aapt" dump badging "../../dist/material-preview/${APP_APK_NAME}" | grep "^application-label:" | grep -F "XX-WRT管理器"
          rm -f ../../build/material-preview/private/signing.p12

      - name: Upload installable Material APK
        uses: actions/upload-artifact@v4
        with:
          name: XX-WRT-Material-APK
          path: dist/material-preview/XX-WRT-Material-v*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Material APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TAG="v${APP_VERSION}"
            TITLE="XX-WRT管理器 v${APP_VERSION}"
          else
            TAG="material-wrt-v${APP_VERSION}"
            TITLE="XX-WRT管理器 v${APP_VERSION} (branch build)"
          fi
          APK="../../dist/material-preview/${APP_APK_NAME}"
          test -f "$APK" || { echo "::error::Release APK missing: $APK"; exit 1; }
          VERSION_NOTES="../../docs/releases/v${APP_VERSION}.md"
          test -s "$VERSION_NOTES" || { echo "::error::Missing per-version release notes: $VERSION_NOTES"; exit 1; }
          grep -Eq '^## (新功能|优化|修复|其他变更)' "$VERSION_NOTES" || {
            echo "::error::Release notes must contain structured change categories"
            exit 1
          }
          NOTES="../../build/material-preview/release-notes.md"
          cp "$VERSION_NOTES" "$NOTES"
          {
            printf '\n---\n'
            printf '%s\n' "- 构建提交：$GITHUB_SHA"
            printf '%s\n' "- [Actions 构建记录](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
            else
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --prerelease --repo "$GITHUB_REPOSITORY"
            fi
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file "$NOTES" --prerelease --repo "$GITHUB_REPOSITORY"
          fi

          # Existing Releases retain earlier assets unless explicitly removed.
          # Keep only the canonical versioned APK while preserving non-APK assets.
          while IFS= read -r asset_name; do
            [[ "$asset_name" == *.apk ]] || continue
            if [[ "$asset_name" != "$APP_APK_NAME" ]]; then
              echo "Removing obsolete Release APK: $asset_name"
              gh release delete-asset "$TAG" "$asset_name" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")
          # Confirm the published Release includes the signed canonical APK.
          gh release view "$TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY" | grep -Fxq "$APP_APK_NAME"

      # Only main's signed, published APK is eligible for the public mirror.
      # Lucky's built-in "file service" serves this folder.
      - name: Sync stable APK to Aliyun Lucky file service
        if: github.ref_name == 'main'
        shell: bash
        env:
          UPDATE_HOST: ${{ secrets.XXWRT_UPDATE_SSH_HOST }}
          UPDATE_USER: ${{ secrets.XXWRT_UPDATE_SSH_USER }}
          UPDATE_PRIVATE_KEY: ${{ secrets.XXWRT_UPDATE_SSH_PRIVATE_KEY }}
          UPDATE_KNOWN_HOSTS: ${{ secrets.XXWRT_UPDATE_SSH_KNOWN_HOSTS }}
          UPDATE_PORT: ${{ vars.XXWRT_UPDATE_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [[ -z "$UPDATE_HOST" && -z "$UPDATE_USER" && -z "$UPDATE_PRIVATE_KEY" && -z "$UPDATE_KNOWN_HOSTS" ]]; then
            echo "::notice::Aliyun mirror SSH secrets are not configured; continuing GitHub Release only."
            exit 0
          fi
          for variable in UPDATE_HOST UPDATE_USER UPDATE_PRIVATE_KEY UPDATE_KNOWN_HOSTS; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Incomplete Aliyun mirror configuration: missing $variable"
              exit 1
            fi
          done
          [[ "$UPDATE_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Invalid SSH port"; exit 1; }

          # Trust only the server's independently verified public host key.
          umask 077
          SSH_DIR="$RUNNER_TEMP/xxwrt-update-ssh"
          mkdir -p "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$UPDATE_PRIVATE_KEY" > "$SSH_DIR/id_deploy"
          printf '%s\n' "$UPDATE_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/id_deploy" "$SSH_DIR/known_hosts"
          SSH_OPTIONS=( -i "$SSH_DIR/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -p "$UPDATE_PORT" )
          SCP_OPTIONS=( -i "$SSH_DIR/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -P "$UPDATE_PORT" )
          DEST="${UPDATE_USER}@${UPDATE_HOST}"
          REMOTE_DIR="/srv/app-updates"
          ssh "${SSH_OPTIONS[@]}" "$DEST" "test -d '$REMOTE_DIR' && test -w '$REMOTE_DIR'"

          APK="../../dist/material-preview/${APP_APK_NAME}"
          MANIFEST="../../build/material-preview/version.json"
          test -s "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          RELEASE_NOTES="../../docs/releases/v${APP_VERSION}.md"
          test -s "$RELEASE_NOTES" || { echo "::error::Release notes missing: $RELEASE_NOTES"; exit 1; }
          jq -n \
            --rawfile releaseNotes "$RELEASE_NOTES" \
            --arg version "$APP_VERSION" \
            --arg tag "v${APP_VERSION}" \
            --arg title "XX-WRT管理器 v${APP_VERSION}" \
            --arg apkName "$APP_APK_NAME" \
            --arg apkUrl "https://update.12130812.xyz/${APP_APK_NAME}" \
            --arg releaseUrl "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${APP_VERSION}" \
            --arg githubApkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${APP_VERSION}/${APP_APK_NAME}" \
            --argjson apkSize "$APK_SIZE" \
            --arg sha256 "$APK_SHA256" \
            '{schemaVersion:1,version:$version,tag:$tag,title:$title,apkName:$apkName,apkUrl:$apkUrl,releaseUrl:$releaseUrl,githubApkUrl:$githubApkUrl,apkSize:$apkSize,sha256:$sha256,releaseNotes:$releaseNotes}' \
            > "$MANIFEST"

          # Publish the entire APK before making its version visible to clients.
          scp "${SCP_OPTIONS[@]}" "$APK" "$DEST:$REMOTE_DIR/$APP_APK_NAME"
          TMP_NAME="version.json.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"
          scp "${SCP_OPTIONS[@]}" "$MANIFEST" "$DEST:$REMOTE_DIR/$TMP_NAME"
          ssh "${SSH_OPTIONS[@]}" "$DEST" "mv -- '$REMOTE_DIR/$TMP_NAME' '$REMOTE_DIR/version.json'"
          # Delete only obsolete canonical Material APKs; keep the latest five.
          # Verify version.json and its advertised APK before deleting anything.
          ssh "${SSH_OPTIONS[@]}" "$DEST" "python3 - '$REMOTE_DIR' 5" < "$GITHUB_WORKSPACE/.github/scripts/prune_mirror_apks.py"
          echo "Aliyun mirror published: v${APP_VERSION}; retaining newest five APKs"
