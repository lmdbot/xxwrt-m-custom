name: Material UI Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [feature/material-ui]
    paths:
      - "ui/material-prototype/**"
      - ".github/workflows/ui-android-preview.yml"

concurrency:
  group: material-ui-android-preview-terminal
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ui/material-prototype
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            shopt -s nullglob
            managers=( "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager )
            (( ${#managers[@]} > 0 )) || exit 1
            SDKMANAGER="${managers[${#managers[@]}-1]}"
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund

      - name: Build Material UI
        run: npm run build

      - name: Install Chromium for interaction tests
        run: npx playwright install --with-deps chromium

      - name: Verify Material rendering, touch controls, and scroll
        run: npm run test:ui

      - name: Upload mobile UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-ui-smoke-screenshots
          path: ui/material-prototype/test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: material-ui-playwright-failure
          path: ui/material-prototype/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate native Capacitor app
        run: |
          npx cap add android
          npx cap sync android
          # HTTP is used only when the user selects an HTTP router endpoint.
          # Android 9+ blocks plain HTTP by default without an explicit policy.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          src = path.read_text()
          if '<application' not in src:
              raise SystemExit('Android application element missing')
          src = src.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(src)
          PY
          # Use a higher versionCode than the broken preview to permit updates.
          sed -i -E 's/versionCode [0-9]+/versionCode 19/; s/versionName "[^"]+"/versionName "0.5.10"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Apply Android 15/16 native safe-area insets
        run: python3 scripts/patch_android_insets.py

      - name: Compile unsigned release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign Material preview APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XXWRT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XXWRT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing signing key"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing signing password"; exit 1; }
          mkdir -p ../../build/material-preview/private ../../dist/material-preview
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ../../build/material-preview/private/signing.p12
          chmod 600 ../../build/material-preview/private/signing.p12
          INPUT="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*unsigned*.apk' -print -quit)"
          test -n "$INPUT" || { echo "::error::Unsigned APK missing"; exit 1; }
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -p -f 4 "$INPUT" ../../build/material-preview/aligned.apk
          "$TOOLS/zipalign" -c 4 ../../build/material-preview/aligned.apk
          "$TOOLS/apksigner" sign \
            --ks ../../build/material-preview/private/signing.p12 \
            --ks-type PKCS12 --ks-key-alias xxwrt \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out ../../dist/material-preview/XX-WRT-M-Material-QWRT-v0.5.10.apk \
            ../../build/material-preview/aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs ../../dist/material-preview/XX-WRT-M-Material-QWRT-v0.5.10.apk
          "$TOOLS/aapt" dump badging ../../dist/material-preview/XX-WRT-M-Material-QWRT-v0.5.10.apk | grep '^package:' | grep "versionName='0.5.10'" | grep "versionCode='17'"
          rm -f ../../build/material-preview/private/signing.p12

      - name: Upload installable preview
        uses: actions/upload-artifact@v4
        with:
          name: XX-WRT-M-Material-Preview-APK
          path: dist/material-preview/XX-WRT-M-Material-QWRT-v0.5.10.apk
          if-no-files-found: error
          retention-days: 30

      - name: Update separate Material UI prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="material-wrt-v0.5.10"
          APK="../../dist/material-preview/XX-WRT-M-Material-QWRT-v0.5.10.apk"
          NOTES="../../build/material-preview/release-notes.md"
          printf '%s\n' \
            '## XX-WRT M Material UI（设置分类与卡片导航 v0.5.10）' \
            '' \
            '已修复 Vuetify 组件注册、页面交互和 Android 安全区的 Material / Liquid Glass 外观试用版。' \
            '' \
            '- 标准底栏：Vuetify。液态底栏：开源 VGlass；样式切换已移入设备列表左侧菜单。' \
            '- 两种底栏可在 APP 内切换并记忆选择，支持浅色/深色主题。' \
            '- 恢复 main 的多台 OpenWrt 设备列表、状态检测、设备添加/编辑/删除、点击设备进入详情。' \
            '- 设备密码可以选择存入 Android Keystore；未勾选时每次重新验证。' \
            '- 本版没有硬编码演示数据，使用真实设备 RPC 返回的结果。' \
            '- 设备列表左侧菜单、底栏外观设置、可搜索 DHCPv4/v6/无线/应用过滤用户分组。' \
            '- 终端分类导航改为 2×2 宫格卡片，四类终端一屏可选，无需横向滑动；保留原有 DHCPv4/v6、无线终端和 OpenAppFilter 用户数据及切换逻辑。' \
            '- 设置侧栏按方案 C 改为卡片分类导航：路由器、显示、隐私、刷新、实验室、关于；点击后进入独立设置页面，在对应分组内修改设置。' \
            '- 设备列表、主题模式、标准/液态底栏、列表布局、主机名/IP 隐藏、刷新策略、语言、更新、帮助与项目入口均已归类保留。' \
            '- 设置页面支持 Android 返回手势；刷新页展示实际内置刷新周期并提供手动刷新，实验室页明确展示当前暂无可配置项目。' \
            '- 首页磁盘占用与临时空间严格复用 main 的 luci.getMountPoints RPC，无需 file.exec。' \
            '- 统计页展示网络接口 RX/TX 采样与负载历史，使用开源 ECharts。' \
            '- 修复 Android 手势返回：优先关闭弹窗、侧栏、应用二级页、恢复上一页及页签，仅根页面最小化应用。' \
            '- 应用首页改为与 main 类似的图标宫格，点击才显示进程/启动项/路由/WOL/家长控制二级页。' \
            '- 网络页增加 IPv6-PD、MTU、网桥端口、收发流量包数及无线参数。' \
            '- 本版 UI 优化：进程支持搜索、展开完整命令并显示 STAT 状态；启动项同时支持开机自启与运行状态筛选；路由表显示默认/网络/主机/本地等路由类型。' \
            '- 终端卡片增加在线/离线状态圆点，状态依据 QWRT 邻居表及无线关联信息；清空终端搜索后恢复完整列表。' \
            '- 网络唤醒增加网络邻居页签，可直接向邻居表中的设备发送 WOL；网络页改为接口、设备、无线三个分类页签。' \
            '- 网络分类页签改为紧凑三列单行卡片，保留分类名称和数量；终端页签仍保持原有 2×2 布局。' \
            '- 首页增加以太网端口连接状态、实时 RX/TX 速率及累计收发字节；网络硬件数据同时兼容 stats/statistics 两种 RPC 字段。' \
            '- 统计页改为连接后后台每 3 秒持续采样，切换页面直接呈现已有历史；RX/TX 卡片显示当前、平均和峰值。' \
            '- 联网检测状态胶囊增加水平内边距，圆点和连接状态不再贴近两侧。' \
            '- 应用子页面仅保留当前子应用的刷新按钮，隐藏不刷新子应用数据的上层通用刷新按钮；返回应用列表后恢复。' \\
            '- 设备列表参考 main：全部/可达/离线筛选、卡片/列表切换、设备状态、温度、CPU/内存、连接数、终端数和经真实网卡采样计算的上传/下载速率。' \
            '- 修复深色模式 Android 15/16 状态栏：原生背景和前景图标随 APP 深浅色同步；回前台重新应用。' \
            '- 后台刷新不再把已显示设备标成检测中；磁盘/无线/应用用户在可选 RPC 临时失败时保留上次有效数据。' \
            '- 设备详情所有页面将 IP/域名和刷新时间移到内容底部，移除重复宣传与开发说明。' \
            '- WAN/WAN6 显示人类可读运行时间；首页联网监测改为联网检测，字体与运行时间标签一致。' \
            '- 隐私：可独立隐藏路由器名称/系统主机名与 IP/域名；隐藏设置本机持久化，列表及路由器页同步遮挡，编辑配置时仍显示真实值。' \
            '- OpenAppFilter：按原版 RPC 增加应用分类、时间策略、受控终端和高级配置。' \
            '- 恢复出厂：沿用原版 file.exec 参数，必须输入确认短语后才允许执行。' \
            '- **仍有原版终端应用访问历史、断开终端、完整多语言/帮助等差异；历史曲线在当前连接会话内持续采样，退出会话后不跨次持久保存。**' \
            '- Android 独立包名 com.lmdbot.xxwrt.materialpreview（用于并存测试），不会覆盖正式版。' \
            '- 登录密码仅在用户勾选后保存于 Android Keystore；HTTP 明文通信仅建议可信局域网，远程请走 VPN/HTTPS。' \
            "- 本次构建提交：$GITHUB_SHA" \
            "- [Actions 构建记录](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" \
            '' \
            '[下载正式 v1.0.6 基础版](https://github.com/lmdbot/xxwrt-m-custom/releases/tag/v1.0.6)' \
            > "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Material QWRT RPC v0.5.10" --notes-file "$NOTES" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Material QWRT RPC v0.5.10" --notes-file "$NOTES" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
