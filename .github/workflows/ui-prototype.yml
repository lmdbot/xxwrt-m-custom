name: Material UI prototype build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/material-ui
      - feature/network-interface-configuration-v2-0-29
      - main
    paths:
      - "ui/material-prototype/**"
      - "docs/releases/**"
      - ".github/workflows/ui-prototype.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/material-prototype/**"
      - "docs/releases/**"
      - ".github/workflows/ui-prototype.yml"
      - ".github/workflows/ui-android-preview.yml"

permissions:
  contents: read

jobs:
  material-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui/material-prototype
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install open-source UI dependencies
        run: npm install --no-audit --no-fund

      - name: Verify stable release manifest and version handling
        run: npm run test:versions

      - name: Run application and router logic regression tests
        run: npm run test:logic

      - name: Verify per-version release notes needed by main publishing
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p 'require("./package.json").version')"
          NOTES="../../docs/releases/v${APP_VERSION}.md"
          test -s "$NOTES" || { echo "::error::Missing release notes: $NOTES"; exit 1; }
          grep -Eq '^## (新功能|优化|修复|其他变更)' "$NOTES" || {
            echo "::error::Release notes have no recognized change category"
            exit 1
          }

      - name: Build Vuetify + Liquid Glass prototype
        run: npm run build

      # Pre-merge checks should exercise the same Playwright suite used by
      # main's signed APK workflow. Avoid re-running it on main itself.
      - name: Install Chromium for pre-merge UI regression checks
        if: github.event_name == 'pull_request' || github.ref_name == 'feature/network-interface-configuration-v2-0-29'
        run: npx playwright install --with-deps chromium

      - name: Verify pre-merge Android-sized UI interactions
        if: github.event_name == 'pull_request' || github.ref_name == 'feature/network-interface-configuration-v2-0-29'
        run: npm run test:ui

      - name: Upload static prototype (not an Android APK)
        uses: actions/upload-artifact@v4
        with:
          name: xxwrt-material-ui-web-prototype
          path: ui/material-prototype/dist/
          if-no-files-found: error
          retention-days: 30
