name: Material UI prototype build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/material-ui
      - feature/network-interface-configuration-v2-0-29
      - main
    paths:
      - "ui/material-prototype/**"
      - "docs/releases/**"
      - ".github/workflows/ui-prototype.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/material-prototype/**"
      - "docs/releases/**"
      - ".github/workflows/ui-prototype.yml"
      - ".github/workflows/ui-android-preview.yml"

concurrency:
  group: material-ui-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The version/logic suite and production web bundle have no dependency on
  # browser interactions. Start them immediately, in parallel with UI shards.
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui/material-prototype
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui/material-prototype/package.json') }}

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Verify stable releases and version handling
        run: npm run test:versions

      - name: Run application and router logic regression tests
        run: npm run test:logic

      - name: Verify structured release notes
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p 'require("./package.json").version')"
          NOTES="../../docs/releases/v${APP_VERSION}.md"
          test -s "$NOTES" || { echo "::error::Missing release notes: $NOTES"; exit 1; }
          grep -Eq '^## (新功能|优化|修复|其他变更)' "$NOTES" || {
            echo "::error::Release notes have no recognized change category"
            exit 1
          }

      - name: Build production web bundle
        run: npm run build

      - name: Upload static prototype
        uses: actions/upload-artifact@v4
        with:
          name: xxwrt-material-ui-web-prototype
          path: ui/material-prototype/dist/
          if-no-files-found: error
          retention-days: 30

  # Split the existing Playwright suite across independent runners. A shard
  # executes each selected test exactly once; no test files or assertions are
  # added/removed. Playwright starts its own Vite webServer, so build is not a
  # prerequisite and this job must NOT depend on quality-and-build.
  ui-interactions:
    if: github.event_name == 'pull_request' || github.ref_name == 'feature/network-interface-configuration-v2-0-29'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: ui/material-prototype
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui/material-prototype/package.json') }}

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/material-prototype/package.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run existing Android-sized UI suite (shard ${{ matrix.shard }}/3)
        # Two workers per runner × three independent shards = six concurrent
        # Playwright browser workers without overloading a single runner.
        run: npm run test:ui -- --shard=${{ matrix.shard }}/3 --workers=2 --retries=1

      - name: Show slowest cases in shard
        if: always()
        run: node scripts/report_playwright_timing.cjs

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-failure-shard-${{ matrix.shard }}
          path: ui/material-prototype/test-results/
          if-no-files-found: ignore
          retention-days: 14
