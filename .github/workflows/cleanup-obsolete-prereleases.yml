name: One-time cleanup of obsolete Material pre-releases

# Created for the 2026-11-15 maintenance cleanup.
# Re-running the workflow is safe: missing releases are skipped.
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-obsolete-prereleases.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the 27 verified obsolete preview releases and their tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Safety check: the current official release must remain intact.
          official="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.0.0" --jq '.prerelease')"
          if [[ "$official" != "false" ]]; then
            echo "::error::v2.0.0 is not a normal release; refusing cleanup"
            exit 1
          fi

          removed=0
          skipped=0
          while read -r release_id expected_tag; do
            [[ -z "$release_id" ]] && continue
            if ! response="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" 2>/dev/null)"; then
              echo "Already absent: $expected_tag (ID $release_id)"
              ((skipped+=1))
              continue
            fi
            actual_tag="$(jq -r '.tag_name' <<< "$response")"
            prerelease="$(jq -r '.prerelease' <<< "$response")"
            if [[ "$actual_tag" != "$expected_tag" || "$prerelease" != "true" ]]; then
              echo "::error::Release $release_id changed; refusing to delete $expected_tag"
              exit 1
            fi
            echo "Deleting obsolete pre-release $expected_tag (ID $release_id)"
            gh release delete "$expected_tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
            ((removed+=1))
          done <<'OBSOLETE_RELEASES'
          445415374 material-wrt-v2.0.0
          445153287 material-wrt-v0.5.8
          445105863 material-wrt-v0.5.7
          445087694 material-wrt-v0.5.6
          445078639 material-wrt-v0.5.5
          445069405 material-wrt-v0.5.4
          445056854 material-wrt-v0.5.3
          445402741 material-wrt-v0.5.23
          445353982 material-wrt-v0.5.22
          445315078 material-wrt-v0.5.21
          445308596 material-wrt-v0.5.20
          445050029 material-wrt-v0.5.2
          445289432 material-wrt-v0.5.19
          445263171 material-wrt-v0.5.16
          445257673 material-wrt-v0.5.15
          445216917 material-wrt-v0.5.14
          445209278 material-wrt-v0.5.13
          445193381 material-wrt-v0.5.12
          445168411 material-wrt-v0.5.10
          445034303 material-wrt-v0.5.1
          445020960 material-wrt-v0.5.0
          445006799 material-wrt-v0.4.0
          444995406 material-wrt-v0.3.0
          444983834 material-wrt-v0.2.1
          444972904 material-wrt-v0.2.0
          444955837 material-preview-v0.1.1
          444948027 material-preview-v0.1.0
          OBSOLETE_RELEASES

          echo "Removed: $removed; already absent: $skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Official releases v2.0.0 and v1.0.6 are preserved." >> "$GITHUB_STEP_SUMMARY"
