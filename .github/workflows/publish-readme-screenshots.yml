name: Publish README screenshots (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-readme-screenshots.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download screenshots from Material 2.0 CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/xxwrt-shots/source
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/14121187664/zip" \
            -o /tmp/xxwrt-shots/archive.zip
          unzip -q /tmp/xxwrt-shots/archive.zip -d /tmp/xxwrt-shots/source
          test -s /tmp/xxwrt-shots/source/live-standard.png

      - name: Optimize six screenshots and update README
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('/tmp/xxwrt-shots/source')
          target = Path('docs/screenshots')
          target.mkdir(parents=True, exist_ok=True)
          shots = [
              ('refresh-without-flicker.png', 'devices.webp', 1650),
              ('live-standard.png', 'overview.webp', 1090),
              ('actual-traffic-history.png', 'statistics.webp', 1720),
              ('terminal-cards.png', 'clients.webp', 1650),
              ('compact-network-interfaces.png', 'network.webp', 1700),
              ('compact-firewall-rules.png', 'firewall.webp', 1750),
          ]
          for original, dest, height in shots:
              im = Image.open(source / original).convert('RGB')
              im = im.crop((0, 0, im.width, min(height, im.height)))
              width = 800
              im = im.resize((width, round(im.height * width / im.width)), Image.Resampling.LANCZOS)
              im.save(target / dest, format='WEBP', quality=85, method=6)

          block = [
              '## 界面预览',
              '',
              '以下图片来自当前 Material 2.0 的 Playwright UI 自动化测试。**路由器地址、设备名称及各项指标为测试示例数据**，截图用于展示应用界面。',
              '',
              '| 设备列表 | 系统首页 | 统计监控 |',
              '| :---: | :---: | :---: |',
              '| [<img src="docs/screenshots/devices.webp" alt="多路由器设备列表" width="245">](docs/screenshots/devices.webp) | [<img src="docs/screenshots/overview.webp" alt="系统首页" width="245">](docs/screenshots/overview.webp) | [<img src="docs/screenshots/statistics.webp" alt="流量统计" width="245">](docs/screenshots/statistics.webp) |',
              '| **终端设备** | **网络管理** | **防火墙** |',
              '| [<img src="docs/screenshots/clients.webp" alt="终端设备" width="245">](docs/screenshots/clients.webp) | [<img src="docs/screenshots/network.webp" alt="网络管理" width="245">](docs/screenshots/network.webp) | [<img src="docs/screenshots/firewall.webp" alt="防火墙" width="245">](docs/screenshots/firewall.webp) |',
              '',
              '点击图片可查看对应截图。',
              '',
          ]
          readme = Path('README.md')
          content = readme.read_text(encoding='utf-8')
          marker = '## 功能概览\n'
          if marker not in content:
              raise SystemExit('README insertion anchor not found')
          if '## 界面预览' not in content:
              content = content.replace(marker, '\n'.join(block) + '\n' + marker, 1)
              readme.write_text(content, encoding='utf-8')
          PY

      - name: Commit gallery assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "docs: add Material 2.0 screenshots to README"
            git push
          fi
