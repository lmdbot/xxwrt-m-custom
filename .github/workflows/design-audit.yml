name: Design A visual screenshot review (manual)

# Produces comparable screenshots and overlays for human review only.
# It does not certify a physical Android handset or 100% pixel equivalence.
on:
  workflow_dispatch:
  # Temporary branch-only verification. Remove this trigger before merging
  # so the expensive visual matrix stays strictly manual in main.
  push:
    branches: [feature/design-audit-ci-parallel-20261117]
    paths: ['.github/workflows/design-audit.yml']

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui/material-prototype
    steps:
      - name: Check out app and reference designs
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui/material-prototype/package.json') }}

      - name: Install app and screenshot dependencies
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow

      - name: Capture actual app UI from deterministic mock RPC
        env:
          DESIGN_VISUAL_AUDIT: '1'
        run: |
          npx playwright test tests/ui-smoke.spec.cjs \
            --grep "authenticate to real RPC adapter" --workers=1 --retries=0

      - name: Capture design HTML prototype on three phone sizes
        if: always()
        run: node scripts/capture_design_reference.cjs

      - name: Produce pixel-diff and 50-percent overlays for manual review
        if: always()
        run: python3 scripts/compare_design_screenshots.py

      - name: Upload visual audit HTML, source PNGs, and overlays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-a-page-by-page-review
          path: ui/material-prototype/test-results/design-a/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-a-ui-smoke-failures
          path: ui/material-prototype/test-results/
          if-no-files-found: ignore
          retention-days: 14
