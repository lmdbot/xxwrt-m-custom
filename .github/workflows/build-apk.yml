name: Build signed XX-WRT M APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "vendor/base.apk"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

# Serialise builds to avoid simultaneous updates to the same versioned Release.
concurrency:
  group: xxwrt-m-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners include an Android SDK. Avoid
      # android-actions/setup-android@v3 here: it requests the removed
      # legacy SDK package "tools", causing sdkmanager to exit with code 1.
      - name: Ensure Android build-tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"

          if [[ ! -x "$BUILD_TOOLS/zipalign" || ! -x "$BUILD_TOOLS/apksigner" ]]; then
            if command -v sdkmanager >/dev/null 2>&1; then
              SDKMANAGER="$(command -v sdkmanager)"
            else
              shopt -s nullglob
              managers=( "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager )
              if (( ${#managers[@]} == 0 )); then
                echo "::error::Android sdkmanager not found in $SDK_ROOT"
                exit 1
              fi
              SDKMANAGER="${managers[${#managers[@]}-1]}"
            fi
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "build-tools;35.0.0"
          fi

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          # zipalign does not implement -h/--help on some SDK versions.
          # Executable checks above are sufficient; actual alignment is checked below.
          "$BUILD_TOOLS/apksigner" version

      - name: Repair UniApp Internet Detector view bindings
        run: python3 scripts/fix_internet_detector_binding.py

      - name: Apply responsive status capsule UI
        run: python3 scripts/capsule_internet_detector.py

      - name: Move Internet Detector below uptime
        run: python3 scripts/move_detector_below_uptime.py

      - name: Validate compiled JavaScript
        run: |
          node --check src/www/app-service.js
          node --check src/www/app-view.js

      - name: Repackage (this is compiled-bundle overlay, not original Vue compilation)
        run: python3 scripts/repackage.py

      - name: Zip-align APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 build/app-unsigned.apk build/app-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 build/app-aligned.apk

      - name: Restore signing key from GitHub Actions Secrets and sign
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XXWRT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XXWRT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing secret XXWRT_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing secret XXWRT_KEYSTORE_PASSWORD'; exit 1; }
          mkdir -p dist build/private
          chmod 700 build/private
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/private/signing.p12
          chmod 600 build/private/signing.p12
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks build/private/signing.p12 \
            --ks-type PKCS12 \
            --ks-key-alias xxwrt \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out dist/XX-WRT-M-custom.apk build/app-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/XX-WRT-M-custom.apk
          rm -f build/private/signing.p12

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: XX-WRT-M-custom-signed-apk
          path: dist/XX-WRT-M-custom.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read version from signed APK
        id: apk_version
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/XX-WRT-M-custom.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT" || { echo "::error::Android aapt is unavailable"; exit 1; }

          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep '^package:')"
          if [[ "$PACKAGE_LINE" =~ versionName=\'([^\']+)\' ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Cannot read versionName from AndroidManifest.xml"
            exit 1
          fi
          # Ensure versionName is safe for a Git tag and APK asset filename.
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Unsupported APK versionName: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          cp "$APK" "dist/XX-WRT-M-custom-v$VERSION.apk"
          echo "APK versionName: $VERSION; Release tag: v$VERSION"

      - name: Publish or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.apk_version.outputs.tag }}
          APK_VERSION: ${{ steps.apk_version.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="dist/XX-WRT-M-custom-v$APK_VERSION.apk"
          TITLE="XX-WRT M Custom v$APK_VERSION"
          NOTES="build/release-notes.md"
          mkdir -p build
          if [[ "$APK_VERSION" == "1.0.6" ]]; then
            # Baseline Release notes are maintained as a complete document.
            cp docs/releases/v1.0.6.md "$NOTES"
            cat >> "$NOTES" <<EOF

---

**本次自动构建信息**

- APK versionName：$APK_VERSION
- Git 提交：$GITHUB_SHA
- GitHub Actions：[构建 #$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
EOF
          else
            cat > "$NOTES" <<EOF
非官方 XX-WRT M Custom APK。

- APK versionName：$APK_VERSION
- Git 提交：$GITHUB_SHA
- GitHub Actions：[构建 #$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
- 固定签名证书，使用 GitHub Secrets 存储密钥。
EOF
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing Release $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating new Release $RELEASE_TAG"
            gh release create "$RELEASE_TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
